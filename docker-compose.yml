# Full stack on one machine: PostgreSQL, the backend and the frontend (http://localhost:3000).
#   docker compose up --build
# User code runs in DOCKER sandbox mode: one throwaway, network-less container per run,
# started through the host's Docker socket.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: algocode
      POSTGRES_USER: algocode
      POSTGRES_PASSWORD: algocode
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algocode"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    image: algocode-backend:local
    # Root only to reach the host's Docker socket; in Kubernetes the backend runs as uid 10001
    # and talks to a Docker-in-Docker sidecar over localhost instead.
    user: "0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALGOCODE_DB_URL: jdbc:postgresql://db:5432/algocode
      ALGOCODE_DB_USER: algocode
      ALGOCODE_DB_PASSWORD: algocode
      ALGOCODE_SANDBOX_MODE: DOCKER
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    image: algocode-frontend:local
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:8080"

volumes:
  db-data:
