# Full stack on one machine: PostgreSQL, the backend and the frontend (http://localhost:3000).
#   docker compose up --build
# Only the database, for running the backend from your IDE or `mvn spring-boot:run`:
#   docker compose up -d db
# User code runs in DOCKER sandbox mode: one throwaway, network-less container per run,
# started through the host's Docker socket.
name: algopractice

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: algopractice
      POSTGRES_USER: algopractice
      POSTGRES_PASSWORD: algopractice
    ports:
      - "${ALGOPRACTICE_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algopractice"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    image: algopractice-backend:local
    # Root only to reach the host's Docker socket; in Kubernetes the backend runs as uid 10001
    # and talks to a Docker-in-Docker sidecar over localhost instead.
    user: "0"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALGOPRACTICE_DB_URL: jdbc:postgresql://db:5432/algopractice
      ALGOPRACTICE_DB_USER: algopractice
      ALGOPRACTICE_DB_PASSWORD: algopractice
      ALGOPRACTICE_SANDBOX_MODE: DOCKER
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    image: algopractice-frontend:local
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:8080"

volumes:
  db-data:
