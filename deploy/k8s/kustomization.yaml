# kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: algocode
resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
images:
  # Published by .github/workflows/images.yml on every push to main.
  # Pin a commit tag (sha-<short sha>) instead of latest for reproducible deploys.
  - name: algocode-backend
    newName: ghcr.io/anzab-dev/algocode-backend
    newTag: latest
  - name: algocode-frontend
    newName: ghcr.io/anzab-dev/algocode-frontend
    newTag: latest
