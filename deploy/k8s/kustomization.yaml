# kubectl apply -k deploy/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: algopractice
resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
images:
  # Published by .github/workflows/images.yml on every push to main.
  # Pin a commit tag (sha-<short sha>) instead of latest for reproducible deploys.
  - name: algopractice-backend
    newName: algopractice-backend
    newTag: dev
  - name: algopractice-frontend
    newName: algopractice-frontend
    newTag: dev
