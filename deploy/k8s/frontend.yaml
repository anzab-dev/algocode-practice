apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: algocode-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: algocode-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: algocode-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: algocode-frontend
        app.kubernetes.io/part-of: algocode
    spec:
      containers:
        - name: frontend
          image: algocode-frontend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://backend:8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
