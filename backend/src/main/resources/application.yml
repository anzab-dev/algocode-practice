spring:
  application:
    name: algopractice
  datasource:
    # Defaults match the local Postgres from `docker compose up -d db` (see README).
    url: ${ALGOPRACTICE_DB_URL:jdbc:postgresql://localhost:5432/algopractice}
    username: ${ALGOPRACTICE_DB_USER:algopractice}
    password: ${ALGOPRACTICE_DB_PASSWORD:algopractice}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

algopractice:
  cors-origins: ${ALGOPRACTICE_CORS_ORIGINS:http://localhost:5173}
  scratch:
    time-limit-ms: 5000
  sandbox:
    # LOCAL runs code in a child JVM on this machine (development only).
    # DOCKER runs every job in a locked-down, network-less container.
    mode: ${ALGOPRACTICE_SANDBOX_MODE:LOCAL}
    docker-image: ${ALGOPRACTICE_SANDBOX_IMAGE:eclipse-temurin:21-jre-alpine}
    max-heap-mb: 256
    max-concurrent: 4

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  # Tracing/metrics export is off until a backend is configured; see README "Telemetry".
  tracing:
    sampling:
      probability: 1.0
