name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: algopractice
          POSTGRES_USER: algopractice
          POSTGRES_PASSWORD: algopractice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U algopractice" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pre-pull the sandbox image
        run: docker pull eclipse-temurin:21-jre-alpine
      - name: Build and test (includes Docker sandbox tests)
        run: mvn -B verify
      - name: API tests against PostgreSQL
        run: >
          mvn -B -q surefire:test -Dtest=ApiIntegrationTest
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/algopractice
          -Dspring.datasource.username=algopractice -Dspring.datasource.password=algopractice

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker Compose images
        run: docker compose build
      - name: Validate the Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize deploy/k8s | ./kubeconform -strict -summary -
